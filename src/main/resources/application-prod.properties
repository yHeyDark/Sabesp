# ============================================================
# Perfil PROD — PostgreSQL
# ============================================================
# As credenciais reais NUNCA devem ser commitadas no repositório.
# Configure-as via variáveis de ambiente no servidor:
#   DB_URL, DB_USERNAME, DB_PASSWORD
# ============================================================

# ── Datasource PostgreSQL ──────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sabespdb}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:changeme}

# ── JPA / Hibernate ────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ── Inicialização com data.sql ──────────────────────────────
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never

# ── Swagger / OpenAPI ──────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
